<mat-sidenav-container class="layout">
  <mat-sidenav class="sidenav" [opened]="opened()" mode="side">
    <mat-toolbar class="brand">
      <app-logo />
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/library" routerLinkActive="active">
        <mat-icon matListItemIcon>library_books</mat-icon>
        <span matListItemTitle>Library</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="header">
      <div class="toolbar-start">
        <button mat-icon-button (click)="toggle()"><mat-icon>menu</mat-icon></button>
        @if (!opened()) {
          <app-logo size="sm" />
        }
      </div>
      <span class="spacer"></span>
      <span class="email">{{ user()?.email }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
