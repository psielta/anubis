<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/dashboard" aria-label="Anubis home">
      <app-logo />
    </a>

    <nav class="topnav">
      <a routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/library" routerLinkActive="active">
        <mat-icon>library_books</mat-icon>
        <span>Library</span>
      </a>
      <a routerLink="/library/series" routerLinkActive="active">
        <mat-icon>view_carousel</mat-icon>
        <span>Series</span>
      </a>
    </nav>

    <span class="spacer"></span>

    <div class="account">
      <span class="email">{{ user()?.email }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <main class="content"><router-outlet /></main>
</div>
