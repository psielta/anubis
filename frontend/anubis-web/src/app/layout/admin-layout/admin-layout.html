<mat-sidenav-container class="layout">
  <mat-sidenav class="sidenav" [opened]="opened()" mode="side">
    <mat-toolbar class="brand">Anubis</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggle()"><mat-icon>menu</mat-icon></button>
      <span>Admin</span>
      <span class="spacer"></span>
      <span class="email">{{ user()?.email }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
