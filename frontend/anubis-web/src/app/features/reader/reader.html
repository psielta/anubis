<div class="reader">
  <header class="reader-bar">
    <a class="reader-back" routerLink="/library" aria-label="Back to library">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <span class="reader-title">{{ book()?.title ?? 'Reader' }}</span>
    <span class="reader-controls">
      @if (toc().length) {
        <button mat-icon-button [matMenuTriggerFor]="tocMenu" aria-label="Table of contents">
          <mat-icon>list</mat-icon>
        </button>
        <mat-menu #tocMenu="matMenu" class="toc-menu">
          @for (item of toc(); track $index) {
            <button
              mat-menu-item
              [disabled]="!item.page"
              (click)="item.page && goToPage(item.page)"
              [style.padding-inline-start.px]="16 + item.depth * 14"
            >
              <span class="toc-title">{{ item.title }}</span>
              @if (item.page) {
                <span class="toc-page">{{ item.page }}</span>
              }
            </button>
          }
        </mat-menu>
      }
      <button
        mat-icon-button
        (click)="zoom(-10)"
        [disabled]="loading() || !!error()"
        aria-label="Zoom out"
      >
        <mat-icon>remove</mat-icon>
      </button>
      <span class="reader-readout">{{ zoomPct() }}%</span>
      <button
        mat-icon-button
        (click)="zoom(10)"
        [disabled]="loading() || !!error()"
        aria-label="Zoom in"
      >
        <mat-icon>add</mat-icon>
      </button>
      @if (pageCount()) {
        <span class="reader-readout reader-pages">{{ currentPage() }} / {{ pageCount() }}</span>
      }
    </span>
  </header>

  <div class="reader-stage">
    @if (error()) {
      <div class="reader-message">
        <mat-icon>error_outline</mat-icon>
        <p>{{ error() }}</p>
        <a routerLink="/library" class="reader-link">Back to library</a>
      </div>
    } @else if (loading()) {
      <div class="reader-message">Opening the book…</div>
    }
    <div #viewport class="reader-viewport"></div>
  </div>
</div>
