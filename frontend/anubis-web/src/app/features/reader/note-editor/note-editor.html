<div class="ne-toolbar" role="toolbar" aria-label="Formatação">
  <div class="ne-group">
    <button type="button" class="ne-btn" title="Desfazer" aria-label="Desfazer" (click)="undo()">
      <mat-icon>undo</mat-icon>
    </button>
    <button type="button" class="ne-btn" title="Refazer" aria-label="Refazer" (click)="redo()">
      <mat-icon>redo</mat-icon>
    </button>
  </div>

  <div class="ne-group">
    <button
      type="button"
      class="ne-btn ne-text"
      title="Título 1"
      aria-label="Título 1"
      [class.active]="state().h1"
      (click)="toggleHeading(1)"
    >
      H1
    </button>
    <button
      type="button"
      class="ne-btn ne-text"
      title="Título 2"
      aria-label="Título 2"
      [class.active]="state().h2"
      (click)="toggleHeading(2)"
    >
      H2
    </button>
    <button
      type="button"
      class="ne-btn ne-text"
      title="Título 3"
      aria-label="Título 3"
      [class.active]="state().h3"
      (click)="toggleHeading(3)"
    >
      H3
    </button>
  </div>

  <div class="ne-group">
    <button
      type="button"
      class="ne-btn"
      title="Negrito"
      aria-label="Negrito"
      [class.active]="state().bold"
      (click)="toggleBold()"
    >
      <mat-icon>format_bold</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Itálico"
      aria-label="Itálico"
      [class.active]="state().italic"
      (click)="toggleItalic()"
    >
      <mat-icon>format_italic</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Tachado"
      aria-label="Tachado"
      [class.active]="state().strike"
      (click)="toggleStrike()"
    >
      <mat-icon>strikethrough_s</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Código embutido"
      aria-label="Código embutido"
      [class.active]="state().code"
      (click)="toggleCode()"
    >
      <mat-icon>code</mat-icon>
    </button>
  </div>

  <div class="ne-group">
    <button
      type="button"
      class="ne-btn"
      title="Lista com marcadores"
      aria-label="Lista com marcadores"
      [class.active]="state().bulletList"
      (click)="toggleBulletList()"
    >
      <mat-icon>format_list_bulleted</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Lista numerada"
      aria-label="Lista numerada"
      [class.active]="state().orderedList"
      (click)="toggleOrderedList()"
    >
      <mat-icon>format_list_numbered</mat-icon>
    </button>
  </div>

  <div class="ne-group">
    <button
      type="button"
      class="ne-btn"
      title="Citação"
      aria-label="Citação"
      [class.active]="state().blockquote"
      (click)="toggleBlockquote()"
    >
      <mat-icon>format_quote</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Bloco de código"
      aria-label="Bloco de código"
      [class.active]="state().codeBlock"
      (click)="toggleCodeBlock()"
    >
      <mat-icon>data_object</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Link"
      aria-label="Link"
      [class.active]="state().link"
      (click)="toggleLink()"
    >
      <mat-icon>link</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Divisor"
      aria-label="Divisor"
      (click)="setHorizontalRule()"
    >
      <mat-icon>horizontal_rule</mat-icon>
    </button>
  </div>

  <div class="ne-group">
    <button
      type="button"
      class="ne-btn"
      title="Equação embutida"
      aria-label="Equação embutida"
      (click)="insertInlineMath()"
    >
      <mat-icon>functions</mat-icon>
    </button>
    <button
      type="button"
      class="ne-btn"
      title="Equação em bloco"
      aria-label="Equação em bloco"
      (click)="insertBlockMath()"
    >
      <mat-icon>calculate</mat-icon>
    </button>
  </div>
</div>

<div #host class="ne-surface"></div>

@if (!ready()) {
  <p class="ne-loading">Carregando editor…</p>
}
