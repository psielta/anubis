<section class="upload-page" [class.dragging]="dragging()">
  <p class="eyebrow">Arquivo morto</p>
  <h1>Converter PDF para Markdown</h1>
  <p class="lead">
    Envie um PDF para conversão assíncrona. O progresso continua mesmo se você fechar esta tela.
  </p>

  <div
    class="dropzone"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <mat-icon>upload_file</mat-icon>
    <p>Arraste um PDF ou</p>
    <label class="file-label">
      <input type="file" accept=".pdf,application/pdf" (change)="onFileSelected($event)" />
      <span mat-flat-button>Selecionar arquivo</span>
    </label>
    <p class="hint">Máx. {{ 100 }} MB · validação no servidor</p>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  @if (uploading()) {
    <p class="uploading">Enviando…</p>
  }
</section>
