<div class="auth-page">
  <div class="auth-watermark" aria-hidden="true"></div>

  <div class="auth-shell">
    <app-logo size="lg" class="auth-brand" />
    <div class="auth-rule" aria-hidden="true"><span></span></div>

    <mat-card class="auth-card">
      <mat-card-content>
        <p class="eyebrow auth-eyebrow">Comece seu arquivo</p>
        <h1 class="auth-title">Crie sua conta</h1>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nome completo</mat-label>
            <input matInput formControlName="full_name" autocomplete="name" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>E-mail</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Senha</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              autocomplete="new-password"
            />
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="auth-submit"
            [disabled]="loading() || form.invalid"
          >
            {{ loading() ? 'Criando conta…' : 'Criar conta' }}
          </button>
        </form>

        <p class="auth-foot">
          Já tem uma conta? <a routerLink="/login" class="auth-link">Entrar</a>
        </p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
