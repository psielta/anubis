server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve container IPs after recreates.
    # Without this, nginx caches anubis-api at start and returns 502 after
    # deploy.sh api swaps the API container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $anubis_api "anubis-api:8000";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://$anubis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 600s;
        client_max_body_size 300m;
    }

    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://$anubis_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA shell must never be cached, so every deploy is picked up at once
    # (no hard-refresh needed after a deploy).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Content-hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
