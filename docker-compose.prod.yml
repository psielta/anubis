services:
  anubis-db:
    image: pgvector/pgvector:pg17
    container_name: anubis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - anubis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anubis-net

  anubis-minio:
    image: minio/minio:latest
    container_name: anubis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - anubis-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - anubis-net

  anubis-redis:
    image: redis:7-alpine
    container_name: anubis-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anubis-net

  anubis-onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:latest}
    container_name: anubis-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
    volumes:
      - anubis-onlyoffice-data:/var/www/onlyoffice/Data
      - anubis-onlyoffice-logs:/var/log/onlyoffice
      - anubis-onlyoffice-lib:/var/lib/onlyoffice
      - anubis-onlyoffice-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - anubis-net
      - trx_trxnet

  anubis-createbucket:
    image: minio/mc:latest
    container_name: anubis-createbucket
    restart: "no"
    depends_on:
      anubis-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-anubis-library}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://anubis-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    networks:
      - anubis-net

  anubis-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anubis-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      anubis-db:
        condition: service_healthy
      anubis-minio:
        condition: service_healthy
      anubis-redis:
        condition: service_healthy
      anubis-createbucket:
        condition: service_completed_successfully
    networks:
      - anubis-net
      - trx_trxnet

  anubis-pdf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anubis-pdf-worker
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.workers.outbox_worker"]
    env_file:
      - .env
    depends_on:
      anubis-db:
        condition: service_healthy
      anubis-redis:
        condition: service_healthy
      anubis-minio:
        condition: service_healthy
      anubis-createbucket:
        condition: service_completed_successfully
    networks:
      - anubis-net

  anubis-front:
    build:
      context: ./frontend/anubis-web
      dockerfile: Dockerfile
    container_name: anubis-front
    restart: unless-stopped
    depends_on:
      - anubis-api
    networks:
      - trx_trxnet

networks:
  anubis-net:
    internal: true
  trx_trxnet:
    external: true
    name: trx_trxnet

volumes:
  anubis-pgdata:
  anubis-minio:
  anubis-onlyoffice-data:
  anubis-onlyoffice-logs:
  anubis-onlyoffice-lib:
  anubis-onlyoffice-db:
