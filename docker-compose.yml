services:
  db:
    image: postgres:17-alpine
    container_name: anubis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - anubis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: anubis-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@anubis.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"

  minio:
    image: minio/minio:latest
    container_name: anubis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - anubis_miniodata:/data

  redis:
    image: redis:7-alpine
    container_name: anubis-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:latest}
    container_name: anubis-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - anubis_onlyoffice_data:/var/www/onlyoffice/Data
      - anubis_onlyoffice_logs:/var/log/onlyoffice
      - anubis_onlyoffice_lib:/var/lib/onlyoffice
      - anubis_onlyoffice_db:/var/lib/postgresql

  pdf-worker:
    build:
      context: ./backend
    container_name: anubis-pdf-worker
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.workers.outbox_worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  minio-init:
    image: minio/mc:latest
    container_name: anubis-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-anubis-library}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    restart: "no"

volumes:
  anubis_pgdata:
  anubis_miniodata:
  anubis_onlyoffice_data:
  anubis_onlyoffice_logs:
  anubis_onlyoffice_lib:
  anubis_onlyoffice_db:
